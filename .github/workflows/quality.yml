name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: factorforge_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factorforge_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FACTORFORGE_TEST_DSN: postgresql://factorforge_ci:ci-test-only@127.0.0.1:5432/factorforge_test_ci
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated test role
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d factorforge_test_ci
          -v ON_ERROR_STOP=1 -c "CREATE ROLE factorforge_ci LOGIN PASSWORD 'ci-test-only';"
          -c "ALTER DATABASE factorforge_test_ci OWNER TO factorforge_ci;"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest --cov --cov-fail-under=85
      - run: uv build
      - run: uv run pip-audit --skip-editable
  dvc_tooling:
    name: DVC security and restoration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - name: Install isolated locked DVC tooling
        run: uv sync --project tools/dvc --locked
      - name: Audit DVC before execution
        run: >-
          tools/dvc/.venv/bin/python -m pip_audit --format json
          --progress-spinner off --output "$RUNNER_TEMP/factorforge-dvc-audit.json"
      - name: Install application test runner
        run: uv sync --locked
      - name: Require actual restoration after the audit passes
        env:
          FACTORFORGE_DVC_PYTHON: ${{ github.workspace }}/tools/dvc/.venv/bin/python
        run: >-
          uv run --locked pytest tests/integration/test_dvc_restore.py
          -q -k test_real_dvc_restores_original_fixture_from_empty_cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dvc-security-audit
          path: ${{ runner.temp }}/factorforge-dvc-audit.json
          retention-days: 14
  sandbox:
    name: Real Docker sandbox acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - run: uv sync --locked
      - name: Fetch the pinned sanitized runtime archive
        uses: actions/checkout@v4
        with:
          ref: 790c03618afc6defb12977d3844701a08b01565c
          path: artifacts/local/runtime-distribution
          persist-credentials: false
      - name: Enable the containerd image store on this disposable runner
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl --fail --silent --show-error --proto '=https' https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc > /dev/null
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' | sudo tee /etc/apt/sources.list.d/factorforge-docker.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            docker-ce=5:29.2.1-1~ubuntu.24.04~noble \
            docker-ce-cli=5:29.2.1-1~ubuntu.24.04~noble
          config="$RUNNER_TEMP/factorforge-docker-daemon.json"
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json > "$config"
          else
            echo '{}' > "$config"
          fi
          jq '.features = ((.features // {}) + {"containerd-snapshotter": true})' "$config" > "$config.next"
          sudo install -m 0644 "$config.next" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
          docker info
          test "$(docker version --format '{{.Server.Version}}')" = 29.2.1
      - name: Verify and import the exact reviewed Python image
        working-directory: artifacts/local/runtime-distribution
        run: |
          test "$(wc -c < runtime.oci.tar)" -eq 21227520
          echo '9f7b76a6e035cb0a64066be9b7e7bf7db51f831011d43e3a62039324df411a99  runtime.oci.tar' | sha256sum --check --strict
          docker image load --input runtime.oci.tar
          mkdir -p ../sandbox-acceptance
          docker image inspect factorforge-python-runtime@sha256:d3f48bcda1df69a2e87baa63ab56d5883fa790e790c3c7b3c907dcc9097d57d4 > ../sandbox-acceptance/imported-image.json
      - name: Require actual isolation, resource limits and cleanup
        env:
          FACTORFORGE_SANDBOX_ACCEPTANCE: "1"
          FACTORFORGE_SANDBOX_ENDPOINT: unix:///var/run/docker.sock
          FACTORFORGE_SANDBOX_EVIDENCE: ${{ github.workspace }}/artifacts/local/sandbox-acceptance
        run: |
          date -u +%s > artifacts/local/sandbox-acceptance/started-epoch.txt
          uv run --locked pytest tests/integration/test_sandbox_runtime.py -q
      - name: Retain kernel and daemon evidence for terminal-state diagnosis
        if: always()
        run: |
          evidence=artifacts/local/sandbox-acceptance
          mkdir -p "$evidence"
          if ! test -f "$evidence/started-epoch.txt"; then
            echo 'Acceptance did not start' > "$evidence/diagnostics-unavailable.txt"
            exit 0
          fi
          since=$(cat "$evidence/started-epoch.txt")
          until=$(date -u +%s)
          timeout 20 docker version > "$evidence/daemon-version.txt" 2>&1 || echo "$?" > "$evidence/daemon-version.exit"
          timeout 20 docker events --since "$since" --until "$until" --filter type=container --format '{{json .}}' > "$evidence/container-events.jsonl" 2>&1 || echo "$?" > "$evidence/container-events.exit"
          timeout 20 sudo journalctl -k --since "@$since" --until "@$until" --no-pager -n 2000 > "$evidence/kernel.log" 2>&1 || echo "$?" > "$evidence/kernel.exit"
          timeout 20 sudo journalctl -u docker -u containerd --since "@$since" --until "@$until" --no-pager -n 2000 > "$evidence/daemon.log" 2>&1 || echo "$?" > "$evidence/daemon.exit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-acceptance
          path: artifacts/local/sandbox-acceptance
          retention-days: 14
  release_gate:
    name: Complete release gate
    runs-on: ubuntu-latest
    needs: [python, web, dvc_tooling, sandbox]
    if: always()
    steps:
      - name: Require every application and tooling check
        env:
          ALL_CHECKS_PASSED: ${{ needs.python.result == 'success' && needs.web.result == 'success' && needs.dvc_tooling.result == 'success' && needs.sandbox.result == 'success' }}
        run: test "$ALL_CHECKS_PASSED" = "true"
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - run: uv sync --locked
      - run: bun install --cwd apps/web --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun audit --cwd apps/web
      - run: bun run --cwd apps/web playwright install --with-deps chromium
      - name: Start local services
        env:
          FACTORFORGE_MODE: local
        run: |
          uv run uvicorn factorforge.api.app:app --host 127.0.0.1 --port 8001 --no-proxy-headers > /tmp/factorforge-api.log 2>&1 &
          bun run --cwd apps/web start > /tmp/factorforge-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/ready && curl --fail --silent --output /dev/null http://127.0.0.1:3001; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/factorforge-api.log /tmp/factorforge-web.log
          exit 1
      - run: bun run --cwd apps/web e2e
        env:
          FACTORFORGE_E2E_OUTPUT: ${{ github.workspace }}/artifacts/local/web-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/local/web-e2e
          retention-days: 14
