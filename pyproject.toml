[project]
name = "factorforge"
version = "0.1.0"
description = "Autonomous quantitative research with reproducible evidence"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34,<2",
    "fastapi>=0.115,<1",
    "grpcio==1.83.1",
    "httpx>=0.28,<1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "polars>=1.44.2,<2",
    "protobuf==7.36.1",
    "psycopg[binary,pool]>=3.3.5",
    "pyjwt[crypto]>=2.13.0",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
factorforge = "factorforge.cli:main"
factorforge-sandbox = "factorforge.sandbox.command:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factorforge"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.9",
  "httpx>=0.28,<1",
  "grpcio-tools==1.83.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules"]

# Compiler output is regenerated and checked byte-for-byte; handwritten boundaries stay strict.
[tool.ruff.lint.per-file-ignores]
"src/factorforge/interop/lean/lean_pb2*.py" = ["ALL"]
"src/factorforge/interop/lean/lean_pb2.pyi" = ["ALL"]

[tool.ruff.format]
exclude = ["src/factorforge/interop/lean/lean_pb2.py", "src/factorforge/interop/lean/lean_pb2_grpc.py", "src/factorforge/interop/lean/lean_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["factorforge.interop.lean.lean_pb2", "factorforge.interop.lean.lean_pb2_grpc"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "google.protobuf", "google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["factorforge"]
patch = ["subprocess"]
omit = ["*/interop/lean/lean_pb2.py", "*/interop/lean/lean_pb2_grpc.py"]

[tool.coverage.report]
show_missing = true
