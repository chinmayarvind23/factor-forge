[project]
name = "factorforge"
version = "0.1.0"
description = "Autonomous quantitative research with reproducible evidence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
factorforge = "factorforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factorforge"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.9",
  "httpx>=0.28,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["factorforge"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
